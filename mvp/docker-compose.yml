services:
  kmz:
    build:
      context: .
      dockerfile: Dockerfile
    image: kmz-python-modbus:daheng-2.4.2503
    network_mode: host
    restart: unless-stopped
    init: true
    environment:
      KMZ_CONFIG: /app/config/config.yaml
      LOG_LEVEL: INFO
      GENICAM_GENTL64_PATH: /usr/local/lib/daheng
      LD_LIBRARY_PATH: /usr/local/lib/daheng:/usr/lib:/usr/local/lib
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; s=socket.socket(); s.settimeout(2); s.connect((\"127.0.0.1\", 1502)); s.close()'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
